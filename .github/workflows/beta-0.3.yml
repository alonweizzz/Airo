name: Airo Beta 0.3 Windows build

on:
  push:
    branches: [beta-0.3, beta-0.3-performance, beta-0.3-video-stability]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Airo/Airo.csproj
      - name: Build
        run: dotnet build Airo/Airo.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish Airo/Airo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Airo-Beta-0.3-Windows-x64
          path: publish/
          if-no-files-found: error
